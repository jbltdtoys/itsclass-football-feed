name: Refresh football fixture cache
on:
  schedule:
    - cron: '15 6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update cached fixtures
        run: python update_football.py
      - name: Commit changed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/football.json
          git diff --cached --quiet || (git commit -m "Refresh football cache" && git push)
